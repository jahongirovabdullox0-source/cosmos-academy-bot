services:
  - type: web
    name: cosmos-academy-api
    runtime: node
    region: virginia
    plan: free
    buildCommand: npm install && npm run db:deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SECRET
        generateValue: true
      - key: ADMIN_ALLOW_REMOTE
        value: 'true'
      - key: WEBAPP_URL
        sync: false
      - key: ADMIN_PANEL_URL
        sync: false
